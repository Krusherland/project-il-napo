<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Iniciar Sesión - Il Napolitano</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="../assets/css/style.css?v=1728072000">
    <link rel="icon" type="image/svg+xml" href="../assets/images/pizza.svg">
  </head>
  <body class="login-page-body">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-4">
                <div class="login-card">
                    <div class="login-header">
                        <h2 class="mb-0">
                            <i class="fas fa-pizza-slice me-2"></i>
                            Il Napolitano
                        </h2>
                        <p class="mb-0 mt-2 opacity-75">Panel de Administración</p>
                    </div>
                    
                    <div class="login-body">
                        <div id="errorMessages" class="alert alert-danger" style="display: none;"></div>
                        
                        <form method="POST" action="../src/handlers/login.php" autocomplete="on">
                            <div class="mb-3">
                                <label for="username" class="form-label">
                                    <i class="fas fa-user me-1"></i> Usuario o Email
                                </label>
                                <input type="text" 
                                       class="form-control" 
                                       id="username" 
                                       name="username" 
                                       required 
                                       autocomplete="username"
                                       placeholder="Ingrese su usuario o email">
                            </div>
                            
                            <div class="mb-4">
                                <label for="password" class="form-label">
                                    <i class="fas fa-lock me-1"></i> Contraseña
                                </label>
                                <input type="password" 
                                       class="form-control" 
                                       id="password" 
                                       name="password" 
                                       required 
                                       autocomplete="current-password"
                                       placeholder="Ingrese su contraseña">
                            </div>
                            
                            <button type="submit" class="btn btn-primary btn-login w-100" id="login">
                                <i class="fas fa-sign-in-alt me-2"></i>
                                Iniciar Sesión
                            </button>
                        </form>
                        
                        <div class="text-center mt-3">
                            <small class="text-muted">
                                <i class="fas fa-shield-alt me-1"></i>
                                Acceso seguro al sistema
                            </small>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    
    <script>
        const username = document.getElementById("username");
        const pass = document.getElementById("password");
        const btn = document.getElementById("login");
        const errorMessages = document.getElementById("errorMessages");
        
        function displayError(message) {
            errorMessages.innerHTML = '<i class="fas fa-exclamation-triangle me-2"></i><strong>Error:</strong> ' + message;
            errorMessages.style.display = 'block';
        }
        
        function hideError() {
            errorMessages.style.display = 'none';
        }
        
        btn.addEventListener('click', (e) => {
            hideError();
            const passValue = document.getElementById("password").value;
            const userValue = document.getElementById("username").value;
            
            if (passValue.length < 6) {
                e.preventDefault();
                displayError("La contraseña debe tener como mínimo 6 caracteres de longitud.");
                return;
            }
            
            if (userValue === "" || passValue === "") {
                e.preventDefault();
                displayError("Todos los campos son requeridos");
                return;
            }
        });
        
        // Focus on first input
        document.addEventListener('DOMContentLoaded', function() {
            const firstInput = document.querySelector('input[name="username"]');
            if (firstInput && !firstInput.value) {
                firstInput.focus();
            }
        });
        
        // Auto-hide error messages after 5 seconds
        setTimeout(function() {
            const alerts = document.querySelectorAll('.alert');
            alerts.forEach(alert => {
                if (alert.style.display !== 'none') {
                    alert.style.display = 'none';
                }
            });
        }, 5000);
    </script>
  </body>
</html>
